<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Liberty 长期投资观察室：跟踪精选标的距离理想价格的位置。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Liberty · 长期投资观察室</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">跳到主要内容</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7 6.5v19h18" />
              <path d="M11.5 20.5 16 16l3.5 2.8L25 11" />
              <path d="M21 11h4v4" />
            </svg>
          </span>
          <span>
            <strong>Liberty</strong>
            <small>长期投资观察室</small>
          </span>
        </div>

        <nav class="side-nav">
          <p class="nav-label">观察</p>
          <a href="/" data-route data-nav="overview">
            <span data-icon="grid"></span>
            <span>总览</span>
          </a>
          <a href="/watchlist" data-route data-nav="watchlist">
            <span data-icon="list"></span>
            <span>标的清单</span>
            <span class="nav-count" id="nav-security-count">0</span>
          </a>
          <a href="/sectors" data-route data-nav="sectors">
            <span data-icon="layers"></span>
            <span>行业排行</span>
          </a>
          <a href="/opportunities" data-route data-nav="opportunities">
            <span data-icon="radar"></span>
            <span>机会雷达</span>
          </a>
          <a href="/alerts" data-route data-nav="alerts">
            <span data-icon="bell"></span>
            <span>提醒中心</span>
          </a>

          <p class="nav-label">系统</p>
          <a href="/data-status" data-route data-nav="data-status">
            <span data-icon="database"></span>
            <span>数据状态</span>
          </a>
          <a href="/methodology" data-route data-nav="methodology">
            <span data-icon="book"></span>
            <span>规则说明</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="source-status">
            <span class="status-dot is-pending" id="source-status-dot"></span>
            <span>
              <small>行情来源</small>
              <strong id="source-status-label">等待配置</strong>
            </span>
          </div>
          <p>只读观察工具 · 不构成投资建议</p>
        </div>
      </aside>

      <button
        class="sidebar-scrim"
        id="sidebar-scrim"
        type="button"
        aria-label="关闭导航"
        tabindex="-1"
      ></button>

      <section class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button mobile-menu-button"
              id="mobile-menu-button"
              type="button"
              aria-label="打开导航"
              aria-expanded="false"
              aria-controls="sidebar"
            >
              <span data-icon="menu"></span>
            </button>
            <div class="market-status" id="market-status">
              <span class="status-dot is-pending"></span>
              <span>
                <small>市场状态</small>
                <strong>行情未连接</strong>
              </span>
            </div>
          </div>

          <div class="refresh-strip" aria-label="行情刷新状态">
            <div class="refresh-item refresh-item-wide">
              <small>行情截至</small>
              <strong id="quote-as-of">—</strong>
            </div>
            <div class="refresh-item">
              <small>上次刷新</small>
              <strong id="last-refresh">尚无</strong>
            </div>
            <div class="refresh-item">
              <small>下次检查</small>
              <strong class="countdown" id="refresh-countdown">等待配置</strong>
            </div>
            <button class="icon-button refresh-button" id="refresh-button" type="button">
              <span data-icon="refresh"></span>
              <span class="sr-only">立即检查行情</span>
            </button>
          </div>
        </header>

        <div class="demo-banner" id="demo-banner" hidden>
          <span data-icon="flask"></span>
          <span><strong>界面演示模式</strong> · 所有名称、价格和信号均为虚构，不是实时行情。</span>
          <button type="button" id="exit-demo-button">退出演示</button>
        </div>

        <main id="app-main" tabindex="-1">
          <div class="page-loading" aria-live="polite">
            <span class="loading-mark"></span>
            <p>正在载入观察室…</p>
          </div>
        </main>
      </section>
    </div>

    <nav class="mobile-bottom-nav" aria-label="移动端主导航">
      <a href="/" data-route data-nav="overview">
        <span data-icon="grid"></span>
        <span>总览</span>
      </a>
      <a href="/sectors" data-route data-nav="sectors">
        <span data-icon="layers"></span>
        <span>行业</span>
      </a>
      <a href="/opportunities" data-route data-nav="opportunities">
        <span data-icon="radar"></span>
        <span>机会</span>
      </a>
      <a href="/alerts" data-route data-nav="alerts">
        <span data-icon="bell"></span>
        <span>提醒</span>
      </a>
      <button type="button" id="mobile-more-button">
        <span data-icon="more"></span>
        <span>更多</span>
      </button>
    </nav>

    <button
      class="drawer-backdrop"
      id="drawer-backdrop"
      type="button"
      aria-label="关闭标的详情"
      tabindex="-1"
    ></button>
    <aside
      class="detail-drawer"
      id="detail-drawer"
      role="dialog"
      aria-modal="true"
      aria-label="标的详情"
      aria-hidden="true"
      inert
    >
      <div class="drawer-header">
        <div id="drawer-title"></div>
        <button class="icon-button" id="drawer-close-button" type="button" aria-label="关闭详情">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
